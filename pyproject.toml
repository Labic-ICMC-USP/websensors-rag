[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "websensors-flow-rag"
version = "0.4.1"
description = "Pipeline de indexação e recuperação híbrida com MinIO, Docling e Elasticsearch."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "WebSensors Team" }
]
keywords = ["rag", "elasticsearch", "docling", "minio", "bm25", "websensors"]
dependencies = [
  "pydantic>=2.0,<3.0",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "minio>=7.2",
  "tqdm>=4.66",
  "rich>=13.7",
]

[project.optional-dependencies]
notebook = [
  "jupyterlab>=4.2",
  "ipykernel>=6.0",
  "pandas>=2.0",
  "matplotlib>=3.7",
]
observability = [
  "graypy>=2.1.0",
  "mlflow>=2.11.0",
  "psutil>=5.9",
]
reranking = [
  "sentence-transformers>=3.0",
]
docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
all = [
  "graypy>=2.1.0",
  "mlflow>=2.11.0",
  "psutil>=5.9",
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
websensors-flow-rag-api = "websensors_flow_rag.cli:main_api"
websensors-flow-rag-index = "websensors_flow_rag.cli:main_index"
websensors-flow-rag-health = "websensors_flow_rag.cli:main_health"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
